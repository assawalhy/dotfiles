# Enable trackpad/mouse interactions (clicking + scrolling).
gui:
  mouseEvents: true

# Use delta as the diff renderer. `--paging=never` is required: lazygit
# already provides its own scrolling, and delta would otherwise try to page.
# delta picks up the [delta] section from ~/.gitconfig (line-numbers, etc.).
# lazygit >= 0.64 configures diff renderers via `git.diffRenderers` (an
# array, cycled with `|`); the old `git.paging` object was removed then.
# `colorArg: always` is the default for type stdinFilter, so it is omitted.
git:
  diffRenderers:
    - command: delta --dark --paging=never

# Inline images cannot be drawn inside lazygit panes (its UI library drops
# unknown OSC sequences), so `I` suspends lazygit and renders the file's diff
# in the real terminal through the same pager git uses. Works for images and
# text; untracked images show the file itself. `o` (xdg-open) still opens the
# file in the GUI.
customCommands:
  - key: 'I'
    context: 'files'
    command: 'git-img-preview {{.SelectedFile.Name | quote}}'
    output: 'terminal'
    description: 'Preview image / diff in terminal'
